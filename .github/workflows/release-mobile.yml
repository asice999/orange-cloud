name: Build Mobile Release

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (optional)
        required: false
        type: string
      release_name:
        description: Release name (optional)
        required: false
        type: string
      ios_build_type:
        description: iOS build variant
        required: true
        type: choice
        default: selfsigned-lite
        options:
          - selfsigned-lite
          - full
      android_update_note:
        description: Android update note shown in in-app updater
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_number: ${{ steps.meta.outputs.build_number }}
      android_version_code: ${{ steps.versions.outputs.android_version_code }}
      android_version_name: ${{ steps.versions.outputs.android_version_name }}
      ios_marketing_version: ${{ steps.versions.outputs.ios_marketing_version }}
      ios_build_number: ${{ steps.versions.outputs.ios_build_number }}
      android_update_note: ${{ steps.meta.outputs.android_update_note }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mobile versions
        id: versions
        shell: bash
        run: |
          python3 scripts/mobile_versions.py read > /tmp/mobile_versions.json
          python3 -c "import json; data=json.load(open('/tmp/mobile_versions.json', 'r', encoding='utf-8')); [print(f'{k}={v}') for k, v in data.items()]" >> "$GITHUB_OUTPUT"

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_NUMBER="$(date +%s)"
          TAG_INPUT="${{ github.event.inputs.tag_name }}"
          RELEASE_INPUT="${{ github.event.inputs.release_name }}"
          NOTE_INPUT="${{ github.event.inputs.android_update_note }}"
          ANDROID_VERSION_NAME="${{ steps.versions.outputs.android_version_name }}"
          ANDROID_VERSION_CODE="${{ steps.versions.outputs.android_version_code }}"
          IOS_VERSION_NAME="${{ steps.versions.outputs.ios_marketing_version }}"

          if [ -n "$TAG_INPUT" ]; then
            TAG_NAME="$TAG_INPUT"
          else
            TAG_NAME="mobile-v${ANDROID_VERSION_NAME}-${SHORT_SHA}-${BUILD_NUMBER}"
          fi

          if [ -n "$RELEASE_INPUT" ]; then
            RELEASE_NAME="$RELEASE_INPUT"
          else
            RELEASE_NAME="Orange Cloud Android ${ANDROID_VERSION_NAME} / iOS ${IOS_VERSION_NAME}"
          fi

          if [ -n "$NOTE_INPUT" ]; then
            ANDROID_UPDATE_NOTE="$NOTE_INPUT"
          else
            ANDROID_UPDATE_NOTE="v${ANDROID_VERSION_NAME}（${ANDROID_VERSION_CODE}）已发布，请下载更新。"
          fi

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "android_update_note=$ANDROID_UPDATE_NOTE" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          printf 'sdk.dir=%s\n' "$SDK_PATH" > apps/android/local.properties

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/android/release-upload.jks
          printf '%s\n' \
            'storeFile=release-upload.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > apps/android/keystore.properties

      - name: Normalize Android daemon JDK for CI
        shell: bash
        run: |
          rm -f apps/android/gradle/gradle-daemon-jvm.properties
          echo "Using CI-provided JAVA_HOME=$JAVA_HOME"

      - name: Build signed direct release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDirectRelease

      - name: Package Android asset
        id: package
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"
          VERSION_NAME="${{ needs.prepare.outputs.android_version_name }}"
          VERSION_CODE="${{ needs.prepare.outputs.android_version_code }}"
          SRC="apps/android/app/build/outputs/apk/direct/release/app-direct-release.apk"
          ASSET_NAME="OrangeCloud-android-v${VERSION_NAME}-${VERSION_CODE}-${TAG_NAME}-release.apk"
          test -f "$SRC"
          cp "$SRC" "dist/$ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.prepare.outputs.tag_name }}
          path: dist/*.apk
          retention-days: 7
          compression-level: 0

  ios:
    runs-on: macos-15
    needs: prepare
    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Resolve Package Dependencies
        working-directory: apps/ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud"

      - name: Build iOS app
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project "Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ needs.prepare.outputs.build_number }} \
            ONLY_ACTIVE_ARCH=NO

      - name: Package iOS IPA
        id: package
        working-directory: apps/ios
        shell: bash
        run: |
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"
          BUILD_TYPE="${{ github.event.inputs.ios_build_type }}"
          VERSION_NAME="${{ needs.prepare.outputs.ios_marketing_version }}"
          VERSION_CODE="${{ needs.prepare.outputs.ios_build_number }}"
          ASSET_NAME="OrangeCloud-ios-v${VERSION_NAME}-${VERSION_CODE}-${TAG_NAME}-${BUILD_TYPE}.ipa"

          zip -qry "$GITHUB_WORKSPACE/$ASSET_NAME" Payload
          rm -rf Payload

          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.prepare.outputs.tag_name }}
          path: '*.ipa'
          retention-days: 7
          compression-level: 0

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android
      - ios
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show asset list
        shell: bash
        run: find release-assets -maxdepth 3 -type f -print | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            release-assets/**/*.apk
            release-assets/**/*.ipa
          body: |
            Automated mobile build for commit `${{ needs.prepare.outputs.short_sha }}`.

            Versions built:
            - Android `${{ needs.prepare.outputs.android_version_name }}` (`${{ needs.prepare.outputs.android_version_code }}`)
            - iOS `${{ needs.prepare.outputs.ios_marketing_version }}` (`${{ needs.prepare.outputs.ios_build_number }}`)

            Assets included:
            - Android signed direct release APK
            - iOS unsigned `${{ github.event.inputs.ios_build_type }}` IPA

            Notes:
            - Android direct update site will be synced after this release.
            - iOS IPA is unsigned and intended for self-signing / AltStore / SideStore style installation.

  sync_web_direct:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.prepare.outputs.tag_name }}
          path: release-assets/android

      - name: Update web direct APK and latest.json
        shell: bash
        env:
          VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.android_version_name }}
          UPDATE_NOTE: ${{ needs.prepare.outputs.android_update_note }}
        run: |
          APK_PATH=$(find release-assets/android -name '*.apk' -type f | head -1)
          test -n "$APK_PATH"
          cp "$APK_PATH" apps/web/public/orange-cloud.apk
          python3 -c "import json, os, pathlib; p=pathlib.Path('apps/web/public/android/latest.json'); data=json.loads(p.read_text(encoding='utf-8')); data['versionCode']=int(os.environ['VERSION_CODE']); data['versionName']=os.environ['VERSION_NAME']; data['url']='https://o-c.do/orange-cloud.apk'; data['note']=os.environ['UPDATE_NOTE']; p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\\n', encoding='utf-8')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - name: Validate Cloudflare deploy credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Missing secret: CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy web direct update site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter web deploy

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit synced web assets
        id: commit_web
        shell: bash
        run: |
          git add apps/web/public/orange-cloud.apk apps/web/public/android/latest.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(web): sync direct android release assets"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced web assets
        if: steps.commit_web.outputs.committed == 'true'
        run: git push origin main

  bump_versions:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - release
      - sync_web_direct
    if: ${{ success() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump next mobile versions
        shell: bash
        run: |
          python3 scripts/mobile_versions.py bump > /tmp/mobile_bump.json
          cat /tmp/mobile_bump.json

      - name: Commit bumped versions
        id: commit_bump
        shell: bash
        run: |
          git add scripts/mobile_versions.py apps/android/app/build.gradle.kts "apps/ios/Orange Cloud/Orange Cloud.xcodeproj/project.pbxproj"
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: bump mobile versions after release"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push bumped versions
        if: steps.commit_bump.outputs.committed == 'true'
        run: git push origin main
