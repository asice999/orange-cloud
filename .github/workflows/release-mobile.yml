name: Build Mobile Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (optional)
        required: false
        type: string
      release_name:
        description: Release name (optional)
        required: false
        type: string
      ios_build_type:
        description: iOS build variant
        required: true
        type: choice
        default: selfsigned-lite
        options:
          - selfsigned-lite
          - full

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_number: ${{ steps.meta.outputs.build_number }}
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_NUMBER="$(date +%s)"
          TAG_INPUT="${{ github.event.inputs.tag_name }}"
          RELEASE_INPUT="${{ github.event.inputs.release_name }}"

          if [ -n "$TAG_INPUT" ]; then
            TAG_NAME="$TAG_INPUT"
          else
            TAG_NAME="build-${SHORT_SHA}-${BUILD_NUMBER}"
          fi

          if [ -n "$RELEASE_INPUT" ]; then
            RELEASE_NAME="$RELEASE_INPUT"
          else
            RELEASE_NAME="Orange Cloud mobile build ${SHORT_SHA}"
          fi

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}
      build_mode: ${{ steps.package.outputs.build_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          printf 'sdk.dir=%s\n' "$SDK_PATH" > apps/android/local.properties

      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/android/release-upload.jks
            cat > apps/android/keystore.properties <<EOF
storeFile=release-upload.jks
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
keyPassword=$ANDROID_KEY_PASSWORD
EOF
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed direct release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/android
        run: ./gradlew :app:assembleDirectRelease

      - name: Build installable direct debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: apps/android
        run: ./gradlew :app:assembleDirectDebug

      - name: Package Android asset
        id: package
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"

          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SRC="apps/android/app/build/outputs/apk/direct/release/app-direct-release.apk"
            ASSET_NAME="OrangeCloud-${TAG_NAME}-android-direct-release.apk"
            BUILD_MODE="signed-direct-release"
          else
            SRC="apps/android/app/build/outputs/apk/direct/debug/app-direct-debug.apk"
            ASSET_NAME="OrangeCloud-${TAG_NAME}-android-direct-debug.apk"
            BUILD_MODE="debug-direct-fallback"
          fi

          test -f "$SRC"
          cp "$SRC" "dist/$ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "build_mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.prepare.outputs.tag_name }}
          path: dist/*.apk
          retention-days: 7
          compression-level: 0

  ios:
    runs-on: macos-15
    needs: prepare
    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Resolve Package Dependencies
        working-directory: apps/ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud"

      - name: Build iOS app
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project "Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ needs.prepare.outputs.build_number }} \
            ONLY_ACTIVE_ARCH=NO

      - name: Package iOS IPA
        id: package
        working-directory: apps/ios
        shell: bash
        run: |
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"
          BUILD_TYPE="${{ github.event.inputs.ios_build_type }}"
          ASSET_NAME="OrangeCloud-${TAG_NAME}-ios-${BUILD_TYPE}.ipa"

          zip -qry "$GITHUB_WORKSPACE/$ASSET_NAME" Payload
          rm -rf Payload

          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.prepare.outputs.tag_name }}
          path: '*.ipa'
          retention-days: 7
          compression-level: 0

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android
      - ios
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show asset list
        shell: bash
        run: find release-assets -maxdepth 3 -type f -print | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            release-assets/**/*.apk
            release-assets/**/*.ipa
          body: |
            Automated mobile build for commit `${{ needs.prepare.outputs.short_sha }}`.

            Assets included:
            - Android `${{ needs.android.build_mode }}` APK
            - iOS unsigned `${{ github.event.inputs.ios_build_type }}` IPA

            Notes:
            - Android falls back to a debug-signed direct APK when release signing secrets are not configured.
            - iOS IPA is unsigned and intended for self-signing / AltStore / SideStore style installation.
